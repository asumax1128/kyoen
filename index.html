<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>共円</title>
<meta name="description" content="格子点に石を置き合い、4つの石が同一円周（または一直線）に乗ったら指摘する数学ゲーム「共円」。CPU対戦・友人との対戦・オンライン対戦・問題モード。">

<!--
  =====================================================================
  共円（きょうえん）
  =====================================================================
  モード：1人で練習（CPU対戦）／友人と対戦（同じ画面）／問題モード／オンライン対戦
  オンライン対戦は Firebase Realtime Database（プロジェクト asumath-games）の
  games/kyoen/rooms 以下を使います。匿名ログインしてから読み書きします。
  ルームは6時間たつと同じコードを再利用できるようになります。
  =====================================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  /* ---------- layout shells ---------- */

  .home-title{
    font-size:56px;
    font-weight:800;

  }
  .home-tagline{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:15px;
    max-width:38em;
  }
  .home-diagram{

    background:var(--accent);

    border-color:var(--accent);
    font-weight:700;

  .btn-danger{

  .point-pop{

    transform-origin:center;

    0%{transform:scale(1);}
    50%{transform:scale(1.55);}
    100%{transform:scale(1);}

    50%{opacity:.35;}

    inset:0;
    pointer-events:none;

    box-shadow:inset 0 0 90px 20px rgba(232,86,62,.55);

    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:'Shippori Mincho',serif;

    font-weight:800;
    color:rgba(232,86,62,.28);
    pointer-events:none;

  .winner-banner{

    border-radius:var(--radius);

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.26/Tone.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;

/* =====================================================================
   Firebase 設定（CROWD READER・PROOF BLUFF と同じ asumath-games プロジェクト）
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC3__kwx4TH-ezcCCUWcb_J7PWZ7pDUjDc",
  authDomain: "asumath-games.firebaseapp.com",
  databaseURL: "https://asumath-games-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asumath-games",
  storageBucket: "asumath-games.firebasestorage.app",
  messagingSenderId: "254715782397",
  appId: "1:254715782397:web:bda2fd2283b292db050a94"
};
const CONFIG_IS_PLACEHOLDER = FIREBASE_CONFIG.apiKey === "YOUR_API_KEY";

/* =====================================================================
   定数
   ===================================================================== */
const PLAYER_COLORS = ["#e8563e", "#4fa8d8", "#7ed9a8", "#e8c55a", "#c77dd1"];
const MAX_PLAYERS = 5;
const MIN_PLAYERS = 2;
const BOARD_PRESETS = [{
  key: "small",
  label: "小盤（9×9）",
  radius: 4
}, {
  key: "medium",
  label: "中盤（11×11）",
  radius: 5
}, {
  key: "large",
  label: "大盤（15×15）",
  radius: 7
}];
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 0/O, 1/I を除外
const LOG_LIMIT = 60;

/* =====================================================================
   幾何ユーティリティ
   ===================================================================== */
// 4x4 行列式（厳密な整数演算。座標は格子点なので誤差なし）
function det4(m) {
  function det(mat) {
    const n = mat.length;
    if (n === 1) return mat[0][0];
    if (n === 2) return mat[0][0] * mat[1][1] - mat[0][1] * mat[1][0];
    let sum = 0;
    for (let col = 0; col < n; col++) {
      const minor = mat.slice(1).map(row => row.filter((_, j) => j !== col));
      sum += (col % 2 === 0 ? 1 : -1) * mat[0][col] * det(minor);
    }
    return sum;
  }
  return det(m);
}

// 4点が「共円」または「共線（半径無限の円とみなす）」かどうかを厳密判定
function isKyoen(points) {
  if (points.length !== 4) return null;
  const m = points.map(p => [p.x, p.y, p.x * p.x + p.y * p.y, 1]);
  return det4(m) === 0;
}

// 3点から外心・外半径を求める（表示用のプレビュー。3点が同一直線上なら null を返す）
function circumcircle(a, b, c) {
  const d = 2 * (a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y));
  if (d === 0) return null;
  const ux = ((a.x * a.x + a.y * a.y) * (b.y - c.y) + (b.x * b.x + b.y * b.y) * (c.y - a.y) + (c.x * c.x + c.y * c.y) * (a.y - b.y)) / d;
  const uy = ((a.x * a.x + a.y * a.y) * (c.x - b.x) + (b.x * b.x + b.y * b.y) * (a.x - c.x) + (c.x * c.x + c.y * c.y) * (b.x - a.x)) / d;
  const r = Math.hypot(a.x - ux, a.y - uy);
  return {
    x: ux,
    y: uy,
    r
  };
}

/* =====================================================================
   雑多なユーティリティ

function randomCode(len) {
  let s = "";
  for (let i = 0; i < len; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}
function randomId() {

// プレイヤーIDはタブごと（sessionStorage）。再読み込みしても同じ人として戻れ、

const DIFFICULTY_OPTIONS = [{ key: "easy", label: "簡単" }, { key: "normal", label: "普通" }, { key: "hard", label: "難しい" }];

/* =====================================================================
   Firebase 初期化 & DB フック
   CROWD READER / PROOF BLUFF と同じ Firebase プロジェクト（asumath-games）の
   games/kyoen/rooms 以下を使う。匿名ログインしてから読み書きする。
   ===================================================================== */
const ROOT = "games/kyoen/rooms";
const ROOM_TTL = 6 * 60 * 60 * 1000; // 6時間たった部屋コードは再利用できる
const ACCUSE_LIMIT_MS = 45000; // 指摘中（ゲーム一時停止）にできる最大時間
const ACCUSE_STALE_MS = 60000; // これより古い「指摘中」は無効とみなす（切断対策）
let db = null;
let serverOffset = 0;
if (!CONFIG_IS_PLACEHOLDER && typeof firebase !== "undefined") {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    db.ref(".info/serverTimeOffset").on("value", s => {
      serverOffset = s.val() || 0;
    });
  } catch (e) {
    console.error(e);
    db = null;
  }
}
const ONLINE_READY = !!db;
function nowMs() {
  return Date.now() + serverOffset;
}
function roomRef(roomId, sub) {
  return db.ref(ROOT + "/" + roomId + (sub ? "/" + sub : ""));
}
let authPromise = null;
function ensureAuth() {
  if (!db) return Promise.reject(new Error("FIREBASE_NOT_CONFIGURED"));
  if (!firebase.auth) return Promise.resolve(null);
  if (!authPromise) {
    authPromise = new Promise((resolve, reject) => {
      const auth = firebase.auth();
      const unsub = auth.onAuthStateChanged(u => {
        if (u) {
          unsub();
          resolve(u);
        }
      });
      auth.signInAnonymously().catch(e => {
        unsub();
        authPromise = null;
        reject(e);
      });
    });
  }
  return authPromise;
}
async function runTx(ref, updater) {
  await ensureAuth();
  return new Promise((resolve, reject) => {
    ref.transaction(updater, (err, committed, snapshot) => {
      if (err) reject(err);else resolve({
        committed,
        snapshot
      });
    }, false);
  });
}
function useRoomState(roomId) {
  const [state, setState] = useState(undefined); // undefined = 読み込み中, null = 見つからない, "error" = 接続失敗
  useEffect(() => {
    if (!roomId || !db) return;
    setState(undefined);
    let ref = null;
    let cancelled = false;
    const cb = snap => setState(snap.val());
    const onErr = () => setState("error");
    ensureAuth().then(() => {
      if (cancelled) return;
      ref = roomRef(roomId);
      ref.on("value", cb, onErr);
    }).catch(onErr);
    return () => {
      cancelled = true;
      if (ref) ref.off("value", cb);
    };
  }, [roomId]);
  return state;
}

// 接続状態（オンライン／切断中）を players/<id>/online に反映する
function usePresence(roomId, myId, isMember) {
  useEffect(() => {
    if (!db || !roomId || !isMember) return;
    const pref = roomRef(roomId, "players/" + myId);
    const conn = db.ref(".info/connected");
    const cb = s => {
      if (s.val() !== true) return;
      pref.child("online").onDisconnect().set(false);
      pref.transaction(cur => cur === null ? null : cur.left ? undefined : Object.assign({}, cur, {
        online: true
      }), null, false);
    };
    conn.on("value", cb);
    return () => {
      conn.off("value", cb);
    };
  }, [roomId, myId, isMember]);
}

/* =====================================================================
   ルーム操作（すべて transaction 経由でサーバ側の状態を安全に更新）
   ===================================================================== */
function pushLog(room, entry) {
  const log = (room.log || []).slice();
  log.push(entry);
  while (log.length > LOG_LIMIT) log.shift();
  return log;
}
function nextActiveTurn(turnOrder, players, fromIdx) {
  const n = turnOrder.length;
  for (let step = 1; step <= n; step++) {
    const idx = (fromIdx + step) % n;
    const pid = turnOrder[idx];
    if (players[pid] && players[pid].active) return pid;
  }
  return null;
}
function isAccusingLive(room) {
  return !!(room && room.accusing && room.accusing.pid && nowMs() - (room.accusing.at || 0) < ACCUSE_STALE_MS);
}
function namedPlayerIds(room) {
  return Object.keys(room.players || {}).filter(pid => room.players[pid] && room.players[pid].name).sort((a, b) => room.players[a].order - room.players[b].order);
}
function activeIdsOf(room) {
  return (room.turnOrder || []).filter(pid => room.players[pid] && room.players[pid].active);
}
// 生存者が1人以下になったら決着
function settleIfOver(room) {
  const act = activeIdsOf(room);
  if (act.length <= 1) {
    room.meta.status = "finished";
    room.winner = act.length === 1 ? act[0] : "draw";
    room.accusing = null;
    room.log = pushLog(room, {
      type: "win",
      name: act.length === 1 ? room.players[act[0]].name : null,
      ts: nowMs()
    });
  }
}
// 現在の手番の人が脱落していたら次の人へ送る
function fixTurn(room) {
  const cur = room.players[room.currentTurn];
  if (!cur || !cur.active) {
    const idx = (room.turnOrder || []).indexOf(room.currentTurn);
    room.currentTurn = nextActiveTurn(room.turnOrder || [], room.players, idx >= 0 ? idx : 0);
    room.turnStartedAt = nowMs();
  }
}
// 指摘が終わったら、一時停止していた持ち時間を再開する
function resumeClock(room) {
  const a = room.accusing;
  room.turnStartedAt = nowMs() - (a && a.elapsed ? a.elapsed : 0);
  room.accusing = null;
}
function applyPlace(room, pid, x, y, auto) {
  const stones = room.stones || [];
  if (stones.some(s => s.x === x && s.y === y)) return false;
  const seq = stones.length;
  stones.push({
    x,
    y,
    owner: pid,
    seq
  });
  room.stones = stones;
  room.lastStoneSeq = seq;
  room.log = pushLog(room, {
    type: "place",
    pid,
    name: room.players[pid].name,
    x,
    y,
    auto: !!auto,
    ts: nowMs()
  });
  const r = room.meta.boardRadius;
  if (stones.length >= (2 * r + 1) * (2 * r + 1)) {
    room.meta.status = "finished";
    room.winner = "draw";
    room.log = pushLog(room, {
      type: "draw",
      ts: nowMs()
    });
    return true;
  }
  room.currentTurn = nextActiveTurn(room.turnOrder, room.players, room.turnOrder.indexOf(pid));
  room.turnStartedAt = nowMs();
  return true;
}
function freeColor(room) {
  const used = new Set(namedPlayerIds(room).map(pid => room.players[pid].color));
  return PLAYER_COLORS.find(c => !used.has(c)) || PLAYER_COLORS[0];
}
async function createRoom(hostName, presetKey, maxPlayers, ruleset, timeLimit) {
  const myId = getOrCreatePlayerId();
  const preset = BOARD_PRESETS.find(p => p.key === presetKey) || BOARD_PRESETS[1];
  for (let attempt = 0; attempt < 8; attempt++) {
    const code = randomCode(5);
    const initial = {
      meta: {
        createdAt: nowMs(),
        boardRadius: preset.radius,
        maxPlayers: maxPlayers,
        hostId: myId,
        status: "waiting",
        ruleset: ruleset || "major",
        timeLimit: timeLimit || null,
        gameNo: 0
      },
      players: {
        [myId]: {
          name: hostName,
          color: PLAYER_COLORS[0],
          order: 0,
          active: true,
          online: true
        }
      },
      turnOrder: [],
      currentTurn: null,
      stones: [],
      lastStoneSeq: -1,
      log: [],
      winner: null
    };
    const {
      committed,
      snapshot
    } = await runTx(roomRef(code), cur => {
      if (cur && cur.meta && nowMs() - (cur.meta.createdAt || 0) < ROOM_TTL) return undefined; // 使用中
      return initial;
    });
    if (committed && snapshot.val() && snapshot.val().meta.hostId === myId) return code;
  }
  throw new Error("ROOM_CODE_EXHAUSTED");
}
async function joinRoom(roomId, name) {
  const myId = getOrCreatePlayerId();
  let outcome = "ok";
  const {
    committed,
    snapshot
  } = await runTx(roomRef(roomId), room => {
    outcome = "ok";
    if (room === null) {
      outcome = "not_found";
      return null;
    }
    if (!room.meta || nowMs() - (room.meta.createdAt || 0) > ROOM_TTL && room.meta.status !== "playing") {
      outcome = "not_found";
      return undefined;
    }
    const mine = room.players && room.players[myId];
    if (mine && mine.name && !mine.left) {
      outcome = "already_in";
      return room;
    }
    if (room.meta.status !== "waiting") {
      outcome = "already_started";
      return undefined;
    }
    room.players = room.players || {};
    const ids = namedPlayerIds(room).filter(pid => !room.players[pid].left);
    if (ids.length >= room.meta.maxPlayers) {
      outcome = "full";
      return undefined;
    }
    const maxOrder = ids.reduce((m, pid) => Math.max(m, room.players[pid].order), -1);
    room.players[myId] = {
      name,
      color: freeColor(room),
      order: maxOrder + 1,
      active: true,
      online: true
    };
    return room;
  });
  if (committed && !snapshot.val()) outcome = "not_found";
  if (!committed && outcome === "ok") outcome = "conflict";
  return {
    outcome,
    room: snapshot ? snapshot.val() : null
  };
}
function resetForNewGame(room, ids) {
  ids.forEach(pid => {
    room.players[pid].active = true;
  });
  // 退室した人は名簿から外す
  Object.keys(room.players).forEach(pid => {
    if (!ids.includes(pid)) delete room.players[pid];
  });
  room.turnOrder = ids;
  room.stones = [];
  room.lastStoneSeq = -1;
  room.winner = null;
  room.accusing = null;
  room.lastEvent = null;
  room.turnStartedAt = nowMs();
}
async function startGame(roomId) {
  const myId = getOrCreatePlayerId();
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    if (room.meta.hostId !== myId || room.meta.status !== "waiting") return undefined;
    const ids = namedPlayerIds(room).filter(pid => !room.players[pid].left);
    if (ids.length < MIN_PLAYERS) return undefined;
    resetForNewGame(room, ids);
    room.meta.status = "playing";
    room.meta.gameNo = 0;
    room.currentTurn = ids[0];
    room.log = [{
      type: "start",
      ts: nowMs()
    }];
    return room;
  });
}
// ホスト：同じメンバーでもう一局（先手は1人ずつずらす）
async function rematchRoom(roomId) {
  const myId = getOrCreatePlayerId();
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    if (room.meta.hostId !== myId || room.meta.status !== "finished") return undefined;
    const ids = (room.turnOrder || []).filter(pid => room.players[pid] && room.players[pid].name && !room.players[pid].left);
    if (ids.length < MIN_PLAYERS) {
      resetForNewGame(room, namedPlayerIds(room).filter(pid => !room.players[pid].left));
      room.meta.status = "waiting";
      room.turnOrder = [];
      room.currentTurn = null;
      room.log = [];
      return room;
    }
    resetForNewGame(room, ids);
    room.meta.gameNo = (room.meta.gameNo || 0) + 1;
    room.meta.status = "playing";
    room.currentTurn = ids[room.meta.gameNo % ids.length];
    room.log = [{
      type: "start",
      ts: nowMs()
    }];
    return room;
  });
}
// ホスト：ロビーに戻して参加者を募り直す
async function backToLobby(roomId) {
  const myId = getOrCreatePlayerId();
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    if (room.meta.hostId !== myId) return undefined;
    resetForNewGame(room, namedPlayerIds(room).filter(pid => !room.players[pid].left));
    room.meta.status = "waiting";
    room.turnOrder = [];
    room.currentTurn = null;
    room.log = [];
    return room;
  });
}
async function placeStone(roomId, x, y) {
  const myId = getOrCreatePlayerId();
  let outcome = "rejected";
  await runTx(roomRef(roomId), room => {
    outcome = "rejected";
    if (room === null) return null;
    if (room.meta.status !== "playing" || room.currentTurn !== myId) return undefined;
    if (isAccusingLive(room)) return undefined; // 誰かが指摘中はゲーム停止
    if (!applyPlace(room, myId, x, y, false)) return undefined;
    outcome = "ok";
    return room;
  });
  return outcome;
}
// 持ち時間切れ：ランダムな空きマスに自動で置く（本人が落ちていても他の人の端末が代行する）
async function timeoutMove(roomId, expectTurn, expectCount) {
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    const limit = room.meta.timeLimit;
    if (!limit || room.meta.status !== "playing") return undefined;
    if (room.currentTurn !== expectTurn || (room.stones || []).length !== expectCount) return undefined;
    if (isAccusingLive(room)) return undefined;
    if (nowMs() - (room.turnStartedAt || 0) < limit * 1000 - 400) return undefined;
    const cell = randomEmptyCell(room.stones || [], room.meta.boardRadius);
    if (!cell) return undefined;
    applyPlace(room, room.currentTurn, cell.x, cell.y, true);
    return room;
  });
}
// 「指摘する」を押した瞬間にゲームを止める（早い者勝ち）
async function claimAccuse(roomId) {
  const myId = getOrCreatePlayerId();
  let outcome = "error";
  let busyName = "";
  const {
    committed
  } = await runTx(roomRef(roomId), room => {
    outcome = "error";
    if (room === null) return null;
    if (room.meta.status !== "playing") return undefined;
    const me = room.players[myId];
    if (!me || !me.active) return undefined;
    const stones = room.stones || [];
    if (stones.length < 4) return undefined;
    const last = stones.find(s => s.seq === room.lastStoneSeq);
    if (last && last.owner === myId) {
      outcome = "last_mover";
      return undefined;
    }
    if (isAccusingLive(room) && room.accusing.pid !== myId) {
      outcome = "busy";
      busyName = room.accusing.name;
      return undefined;
    }
    room.accusing = {
      pid: myId,
      name: me.name,
      at: nowMs(),
      elapsed: Math.max(0, nowMs() - (room.turnStartedAt || nowMs()))
    };
    outcome = "ok";
    return room;
  });
  if (committed && outcome === "ok") {
    roomRef(roomId, "accusing").onDisconnect().remove();
  }
  return {
    outcome,
    busyName
  };
}
async function cancelAccuse(roomId) {
  const myId = getOrCreatePlayerId();
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    if (!room.accusing || room.accusing.pid !== myId) return undefined;
    resumeClock(room);
    return room;
  });
  roomRef(roomId, "accusing").onDisconnect().cancel();
}
function makeEvent(kind, accuserId, accuserName, targetId, targetName, pts) {
  return {
    id: randomId(),
    kind,
    accuserId,
    accuserName,
    targetId: targetId || null,
    targetName: targetName || null,
    pts: pts.map(p => [p.x, p.y])
  };
}
// メジャールール：直前の一手を含む4点を指摘。成立したら置いた人が脱落、不成立はおとがめなし
async function accuse(roomId, seqList) {
  const myId = getOrCreatePlayerId();
  let result = "error";
  await runTx(roomRef(roomId), room => {
    result = "error";
    if (room === null) return null;
    if (room.meta.status !== "playing") return undefined;
    if (!room.accusing || room.accusing.pid !== myId) {
      result = "expired";
      return undefined;
    }
    const stones = room.stones || [];
    if (!seqList.includes(room.lastStoneSeq)) return undefined;
    const pts = seqList.map(seq => stones.find(s => s.seq === seq)).filter(Boolean);
    if (pts.length !== 4) return undefined;
    const targetPid = stones.find(s => s.seq === room.lastStoneSeq).owner;
    const accuserName = room.players[myId] ? room.players[myId].name : "?";
    const targetName = room.players[targetPid] ? room.players[targetPid].name : "?";
    resumeClock(room);
    if (!isKyoen(pts)) {
      result = "miss";
      room.log = pushLog(room, {
        type: "fail",
        accuserName,
        pts: pts.map(p => [p.x, p.y]),
        ts: nowMs()
      });
      room.lastEvent = makeEvent("miss", myId, accuserName, null, null, pts);
      return room;
    }
    result = "hit";
    room.players[targetPid].active = false;
    room.log = pushLog(room, {
      type: "eliminate",
      accuserName,
      targetName,
      pts: pts.map(p => [p.x, p.y]),
      ts: nowMs()
    });
    room.lastEvent = makeEvent("hit", myId, accuserName, targetPid, targetName, pts);
    fixTurn(room);
    settleIfOver(room);
    return room;
  });
  roomRef(roomId, "accusing").onDisconnect().cancel();
  return result;
}

// 南稜ローカルルール：どの4点でも指摘できる。成立したら指摘した本人が勝利、不成立なら本人が脱落
async function accuseNanryo(roomId, seqList) {
  const myId = getOrCreatePlayerId();
  let result = "error";
  await runTx(roomRef(roomId), room => {
    result = "error";
    if (room === null) return null;
    if (room.meta.status !== "playing") return undefined;
    if (!room.accusing || room.accusing.pid !== myId) {
      result = "expired";
      return undefined;
    }
    const stones = room.stones || [];
    const pts = seqList.map(seq => stones.find(s => s.seq === seq)).filter(Boolean);
    if (pts.length !== 4) return undefined;
    const accuserName = room.players[myId] ? room.players[myId].name : "?";
    resumeClock(room);
    if (!isKyoen(pts)) {
      result = "miss";
      if (room.players[myId]) room.players[myId].active = false;
      room.log = pushLog(room, {
        type: "accuse_miss_elim",
        accuserName,
        pts: pts.map(p => [p.x, p.y]),
        ts: nowMs()
      });
      room.lastEvent = makeEvent("nanryo_miss", myId, accuserName, null, null, pts);
      fixTurn(room);
      settleIfOver(room);
      return room;
    }
    result = "hit";
    room.meta.status = "finished";
    room.winner = myId;
    room.log = pushLog(room, {
      type: "win_by_accuse",
      accuserName,
      pts: pts.map(p => [p.x, p.y]),
      ts: nowMs()
    });
    room.lastEvent = makeEvent("nanryo_hit", myId, accuserName, null, null, pts);
    return room;
  });
  roomRef(roomId, "accusing").onDisconnect().cancel();
  return result;
}
// 通信が切れたまま戻らない人を脱落扱いにする（誰でも押せる）
async function kickPlayer(roomId, pid) {
  const myId = getOrCreatePlayerId();
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    if (room.meta.status !== "playing" || pid === myId) return undefined;
    const p = room.players[pid];
    if (!p || !p.active || p.online !== false) return undefined;
    p.active = false;
    room.log = pushLog(room, {
      type: "kick",
      name: p.name,
      ts: nowMs()
    });
    if (room.accusing && room.accusing.pid === pid) resumeClock(room);
    fixTurn(room);
    settleIfOver(room);
    return room;
  });
}
async function leaveRoom(roomId) {
  const myId = getOrCreatePlayerId();
  try {
    roomRef(roomId, "players/" + myId + "/online").onDisconnect().cancel();
    roomRef(roomId, "accusing").onDisconnect().cancel();
  } catch (e) {}
  await runTx(roomRef(roomId), room => {
    if (room === null) return null;
    const p = room.players && room.players[myId];
    if (!p) return undefined;
    if (room.meta.status === "waiting") {
      delete room.players[myId];
      const rest = namedPlayerIds(room).filter(pid => !room.players[pid].left);
      if (rest.length === 0) return null; // 誰もいなくなったら部屋ごと消す
      if (room.meta.hostId === myId) room.meta.hostId = rest[0];
      return room;
    }
    p.left = true;
    p.online = false;
    if (room.meta.status === "playing" && p.active) {
      p.active = false;
      room.log = pushLog(room, {
        type: "leave",
        name: p.name,
        ts: nowMs()
      });
      if (room.accusing && room.accusing.pid === myId) resumeClock(room);
      fixTurn(room);
      settleIfOver(room);
    }
    if (room.meta.hostId === myId) {
      const rest = namedPlayerIds(room).filter(pid => !room.players[pid].left);
      if (rest.length === 0) return null;
      room.meta.hostId = rest[0];
    }
    return room;
  });
}

/* =====================================================================
   1人プレイ（オフライン・CPU対戦）エンジン
   ネットワークもFirebaseも使わず、すべてローカルの状態遷移だけで完結する。
   ルールは共通：CPUの一手は「あなた」だけが指摘して脱走させられる一方、
   あなたの一手はCPU側が見逃さず即座に判定する（CPUは計算ミスをしない、
   という設定）。だからこそ盤面を見て違反に気づく力の練習になる。
   ===================================================================== */
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function emptyCells(stones, radius) {
  const cells = [];
  for (let x = -radius; x <= radius; x++) {
    for (let y = -radius; y <= radius; y++) {
      if (!stones.some(s => s.x === x && s.y === y)) cells.push({
        x,
        y
      });
    }
  }
  return cells;
}
// 制限時間切れなどで自動的に空きマスへ着手させるためのランダム選択
function randomEmptyCell(stones, radius) {
  const cells = emptyCells(stones, radius);
  if (cells.length === 0) return null;
  return shuffled(cells)[0];
}

// cell に置いたとき、既存のどれか3点と共円/共線になってしまうか
function wouldViolate(cell, stones) {
  const n = stones.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) if (isKyoen([cell, stones[i], stones[j], stones[k]])) return true;
  return false;
}

// 直前の一手（latestSeq）が既存のどれか3点と共円/共線を作っていないか総当たりで探す
function findViolation(stones, latestSeq) {
  const latest = stones.find(s => s.seq === latestSeq);
  const others = stones.filter(s => s.seq !== latestSeq);
  const n = others.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
    const pts = [latest, others[i], others[j], others[k]];
    if (isKyoen(pts)) return pts;
  }
  return null;
}

// 対局終了後、盤上に存在するが誰にも指摘されなかった共円（共線）をすべて探す
function findMissedCircles(stones, log) {
  const caught = new Set();
  (log || []).forEach(e => {
    if ((e.type === "eliminate" || e.type === "win_by_accuse") && e.pts) {
      const key = e.pts.map(p => p.join(",")).slice().sort().join("|");
      caught.add(key);
    }
  });
  const missed = [];
  const n = stones.length;
  for (let i = 0; i < n; i++)
    for (let j = i + 1; j < n; j++)
      for (let k = j + 1; k < n; k++)
        for (let l = k + 1; l < n; l++) {
          const combo = [stones[i], stones[j], stones[k], stones[l]];
          if (isKyoen(combo)) {
            const key = combo.map(p => [p.x, p.y].join(",")).slice().sort().join("|");
            if (!caught.has(key)) missed.push(combo.map(p => [p.x, p.y]));
          }
        }
  return missed;
}

// CPUの一手：難易度によって選び方を変える
//  easy   : 安全確認をあまりせず、ほぼランダムに置く（初心者向け・隙が多い）
//  normal : 安全なマスがあればランダムにそれを選ぶ（現行の標準的な打ち方）
//  hard   : 安全なマスの中から、その後もできるだけ安全なマスが多く残る一手を選ぶ（簡易先読み）
function cpuChooseMove(stones, radius, difficulty) {
  const allCells = emptyCells(stones, radius);
  if (allCells.length === 0) return null;

  if (difficulty === "easy") {
    const shuffledAll = shuffled(allCells);
    if (Math.random() < 0.25) {
      for (const cell of shuffledAll) {
        if (!wouldViolate(cell, stones)) return cell;
      }
    }
    return shuffledAll[0];
  }

  const safeCells = allCells.filter(cell => !wouldViolate(cell, stones));
  if (safeCells.length === 0) return shuffled(allCells)[0];

  if (difficulty === "hard") {
    const candidates = shuffled(safeCells).slice(0, 25);
    let best = null;
    let bestScore = -1;
    for (const cand of candidates) {
      const hypothetical = stones.concat([{ x: cand.x, y: cand.y, owner: "_tmp", seq: stones.length }]);
      const remaining = shuffled(allCells.filter(c => !(c.x === cand.x && c.y === cand.y))).slice(0, 60);
      let safeCount = 0;
      for (const c of remaining) {
        if (!wouldViolate(c, hypothetical)) safeCount++;
      }
      if (safeCount > bestScore) {
        bestScore = safeCount;
        best = cand;
      }
    }
    return best;
  }

  return shuffled(safeCells)[0];
}
/* =====================================================================
   サウンドエンジン（Tone.js。音源ファイルなしで合成する）
   ブラウザの制約で、最初のユーザー操作があるまで音は鳴らせないため、
   初回クリック時に unlock() して以降使えるようにする。
   Tone が読み込めていない環境（テスト等）でも落ちないよう全て guard する。
   ===================================================================== */
const Sound = (() => {
  let ready = false;
  let muted = localStorage.getItem("kyoen_muted") === "1";
  let synth = null,
    noise = null,
    memb = null;
  function available() {
    return typeof Tone !== "undefined" && Tone && Tone.context;
  }
  async function unlock() {
    if (!available() || ready) return;
    try {
      await Tone.start();
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: {
          type: "triangle"
        },
        envelope: {
          attack: 0.005,
          decay: 0.12,
          sustain: 0.05,
          release: 0.25
        }
      }).toDestination();
      synth.volume.value = -10;
      noise = new Tone.NoiseSynth({
        noise: {
          type: "white"
        },
        envelope: {
          attack: 0.001,
          decay: 0.08,
          sustain: 0
        }
      }).toDestination();
      noise.volume.value = -22;
      memb = new Tone.MembraneSynth().toDestination();
      memb.volume.value = -14;
      ready = true;
    } catch (e) {
      ready = false;
    }
  }
  function isMuted() {
    return muted;
  }
  function setMuted(v) {
    muted = v;
    localStorage.setItem("kyoen_muted", v ? "1" : "0");
  }
  function guard() {
    return ready && !muted && available();
  }
  return {
    unlock,
    isMuted,
    setMuted,
    // 石を置く：短い打撃音
    place() {
      if (!guard()) return;
      try {
        memb.triggerAttackRelease("C2", "16n");
      } catch (e) {}
    },
    // 指摘ボタン：緊張感のある上昇音
    accuseOpen() {
      if (!guard()) return;
      try {
        const now = Tone.now();
        synth.triggerAttackRelease("E4", "16n", now);
        synth.triggerAttackRelease("A4", "16n", now + 0.09);
      } catch (e) {}
    },
    // 点を選ぶ：軽いクリック音
    select() {
      if (!guard()) return;
      try {
        noise.triggerAttackRelease("32n");
      } catch (e) {}
    },
    // 正解：ファンファーレ
    correct() {
      if (!guard()) return;
      try {
        const now = Tone.now();
        ["C5", "E5", "G5", "C6"].forEach((n, i) => {
          synth.triggerAttackRelease(n, "8n", now + i * 0.11);
        });
      } catch (e) {}
    },
    // 不正解：低いブザー
    wrong() {
      if (!guard()) return;
      try {
        const now = Tone.now();
        synth.triggerAttackRelease("Eb3", "8n", now);
        synth.triggerAttackRelease("D3", "4n", now + 0.16);
      } catch (e) {}
    },
    // 残り時間わずか：時計の音
    tick() {
      if (!guard()) return;
      try {
        noise.triggerAttackRelease("64n");
      } catch (e) {}
    },
    // 勝利
    win() {
      if (!guard()) return;
      try {
        const now = Tone.now();
        ["G4", "C5", "E5", "G5", "C6"].forEach((n, i) => {
          synth.triggerAttackRelease(n, "8n", now + i * 0.1);
        });
      } catch (e) {}
    }
  };
})();

/* =====================================================================
   ヒートマップ用：各空きマスについて「そこに置くと何通りの共円ができるか」
   ===================================================================== */
function dangerMap(stones, radius) {
  const map = [];
  const n = stones.length;
  for (let x = -radius; x <= radius; x++) {
    for (let y = -radius; y <= radius; y++) {
      if (stones.some(s => s.x === x && s.y === y)) continue;
      const cell = {
        x,
        y
      };
      let count = 0;
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) if (isKyoen([cell, stones[i], stones[j], stones[k]])) count++;
      map.push({
        x,
        y,
        count
      });
    }
  }
  return map;
}

/* =====================================================================
   パズルモード：ランダムな盤面を生成する
   kind "count" … 盤上にいくつ共円があるか数える（選択肢から選ぶ）
   kind "safe"  … 共円を作らずに置けるマスを1つ見つけてタップする
   ===================================================================== */
function countCircles(stones) {
  let c = 0;
  const n = stones.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) for (let l = k + 1; l < n; l++) if (isKyoen([stones[i], stones[j], stones[k], stones[l]])) c++;
  return c;
}

// 盤上に存在する共円をすべて列挙する（答え合わせでの表示用）
function listCircles(stones) {
  const out = [];
  const n = stones.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) for (let l = k + 1; l < n; l++) {
    const combo = [stones[i], stones[j], stones[k], stones[l]];
    if (isKyoen(combo)) out.push(combo.map(p => ({
      x: p.x,
      y: p.y
    })));
  }
  return out;
}
function generatePuzzle(level) {
  // level 1..3 で盤面サイズと石数を変える
  const radius = level === 1 ? 3 : level === 2 ? 4 : 4;
  // "safe" は石が多いほど安全マスが減って良問になるので、種類ごとに石数を変える
  const kind0 = Math.random() < 0.5 ? "find" : "safe";
  const stoneCount = kind0 === "safe" ? level === 1 ? 7 : level === 2 ? 10 : 13 : level === 1 ? 5 : level === 2 ? 7 : 9;
  const kind = kind0;
  for (let attempt = 0; attempt < 150; attempt++) {
    const cells = [];
    for (let x = -radius; x <= radius; x++) for (let y = -radius; y <= radius; y++) cells.push({
      x,
      y
    });
    const picked = shuffled(cells).slice(0, stoneCount).map((c, i) => ({
      x: c.x,
      y: c.y,
      owner: "puzzle",
      seq: i
    }));
    if (kind === "find") {
      const answer = countCircles(picked);
      // 共円が1組もないと問題にならず、多すぎると簡単すぎるので 1〜3組の盤面だけ採用する
      if (answer >= 1 && answer <= 3) {
        return {
          stones: picked,
          radius,
          kind,
          answer
        };
      }
    } else {
      const empties = emptyCells(picked, radius);
      const safe = empties.filter(c => !wouldViolate(c, picked));
      // 安全なマスが少ないほど良問。多すぎると簡単すぎるので絞る
      if (safe.length >= 1 && safe.length <= Math.max(6, Math.floor(empties.length * 0.4))) {
        return {
          stones: picked,
          radius,
          kind,
          safeCells: safe,
          answer: safe.length
        };
      }
    }
  }
  // 生成に失敗した場合のフォールバック（必ず答えのある正方形の盤面）
  const fallback = [{
    x: 0,
    y: 0,
    owner: "puzzle",
    seq: 0
  }, {
    x: 2,
    y: 0,
    owner: "puzzle",
    seq: 1
  }, {
    x: 0,
    y: 2,
    owner: "puzzle",
    seq: 2
  }, {
    x: 2,
    y: 2,
    owner: "puzzle",
    seq: 3
  }];
  return {
    stones: fallback,
    radius: 3,
    kind: "find",
    answer: 1
  };
}

function initLocalState(cfg) {

  for (let i = 0; i < cfg.cpuCount; i++) {

}

// 友人と対戦（オフライン・同一画面のホットシート）：全員人間、自動判定なし
function initHotseatState(cfg) {
  const players = {};
  const turnOrder = [];
  cfg.names.forEach((name, i) => {
    const pid = "p" + (i + 1);
    players[pid] = {

  });

    },

    }],

}

// pid の手番として (x,y) に着手する。autoCheckSelf が true の場合のみ、その場で置いた本人の一手を判定する
// （CPU対戦であなたの一手をCPUが見逃さず判定する用途）。友人と対戦（ホットシート）や
// CPU自身の一手では false を渡し、指摘されるまで安全とする。
function localPlace(state, pid, x, y, autoCheckSelf) {
  const room = JSON.parse(JSON.stringify(state));
  if (room.meta.status !== "playing") return room;
  if (room.currentTurn !== pid) return room;
  if (room.stones.some(s => s.x === x && s.y === y)) return room;
  const seq = room.stones.length;
  room.stones.push({
    x,
    y,
    owner: pid,
    seq
  });
  room.lastStoneSeq = seq;
  room.log = pushLog(room, {
    type: "place",
    name: room.players[pid].name,
    x,
    y
  });
  const r = room.meta.boardRadius;
  const total = (2 * r + 1) * (2 * r + 1);
  if (room.stones.length >= total) {
    room.meta.status = "finished";
    room.winner = "draw";
    room.log = pushLog(room, {
      type: "draw"
    });
    return room;
  }
  if (autoCheckSelf) {
    const violation = findViolation(room.stones, seq);
    if (violation) {
      room.players[pid].active = false;
      room.humanLost = true;
      room.log = pushLog(room, {
        type: "eliminate",
        accuserName: "CPU",
        targetName: room.players[pid].name,
        pts: violation.map(p => [p.x, p.y])
      });
      room.meta.status = "finished";
      room.winner = null;
      return room;
    }
  }
  const idx = room.turnOrder.indexOf(pid);
  room.currentTurn = nextActiveTurn(room.turnOrder, room.players, idx);
  return room;
}

// 直前の一手を選択4点で指摘する。accuserName は任意（CPU対戦時は「あなた」の名前を渡す。
// 友人と対戦（ホットシート）では誰が指摘したかは記録しない）
function localAccuse(state, seqList, accuserName) {
  const room = JSON.parse(JSON.stringify(state));
  if (room.meta.status !== "playing") return {
    room,
    result: "error"
  };
  if (!seqList.includes(room.lastStoneSeq)) return {
    room,
    result: "error"
  };
  const pts = seqList.map(seq => room.stones.find(s => s.seq === seq)).filter(Boolean);
  if (pts.length !== 4) return {
    room,
    result: "error"
  };
  const targetStone = room.stones.find(s => s.seq === room.lastStoneSeq);
  const targetPid = targetStone.owner;
  if (!isKyoen(pts)) {
    room.log = pushLog(room, {
      type: "fail",
      accuserName: accuserName || null,
      pts: pts.map(p => [p.x, p.y])
    });
    return {
      room,
      result: "miss"
    };
  }
  room.players[targetPid].active = false;
  room.log = pushLog(room, {
    type: "eliminate",
    accuserName: accuserName || null,
    targetName: room.players[targetPid].name,
    pts: pts.map(p => [p.x, p.y])
  });
  if (!room.players[room.currentTurn].active) {
    const idx = room.turnOrder.indexOf(room.currentTurn);
    room.currentTurn = nextActiveTurn(room.turnOrder, room.players, idx);
  }
  const activeIds = room.turnOrder.filter(pid => room.players[pid].active);
  if (activeIds.length <= 1) {
    room.meta.status = "finished";
    room.winner = activeIds.length === 1 ? activeIds[0] : "draw";
    room.log = pushLog(room, {
      type: "win",
      name: activeIds.length === 1 ? room.players[activeIds[0]].name : null
    });
  }
  return {
    room,
    result: "hit"
  };
}

// 南稜ローカルルール：直前の一手に限らず盤上のどの4点でも指摘でき、成立したら指摘した本人が即勝利する
function localAccuseAny(state, seqList, accuserPid) {
  const room = JSON.parse(JSON.stringify(state));
  if (room.meta.status !== "playing") return {
    room,
    result: "error"
  };
  const pts = seqList.map(seq => room.stones.find(s => s.seq === seq)).filter(Boolean);
  if (pts.length !== 4) return {
    room,
    result: "error"
  };
  const accuserName = room.players[accuserPid] ? room.players[accuserPid].name : null;
  if (!isKyoen(pts)) {
    // 不正解：指摘した本人が脱落する
    if (room.players[accuserPid]) room.players[accuserPid].active = false;
    room.log = pushLog(room, {
      type: "accuse_miss_elim",
      accuserName,
      pts: pts.map(p => [p.x, p.y])
    });
    if (!room.players[room.currentTurn] || !room.players[room.currentTurn].active) {
      const idx = room.turnOrder.indexOf(room.currentTurn);
      room.currentTurn = nextActiveTurn(room.turnOrder, room.players, idx >= 0 ? idx : 0);
    }
    const activeIds = room.turnOrder.filter(pid => room.players[pid].active);
    if (activeIds.length <= 1) {
      room.meta.status = "finished";
      room.winner = activeIds.length === 1 ? activeIds[0] : "draw";
      room.log = pushLog(room, {
        type: "win",
        name: activeIds.length === 1 ? room.players[activeIds[0]].name : null
      });
    }
    return {
      room,
      result: "miss"
    };
  }
  room.meta.status = "finished";
  room.winner = accuserPid;
  room.log = pushLog(room, {
    type: "win_by_accuse",
    accuserName,
    pts: pts.map(p => [p.x, p.y])
  });
  return {
    room,
    result: "hit"
  };
}

/* =====================================================================
   UI: 盤面 (SVG)
   ===================================================================== */
function computeCircleOrLine(pts3, toPx, cell, dim) {
  const [a, b, c] = pts3;
  const cc = circumcircle(a, b, c);
  if (cc) {
    const center = toPx(cc.x, cc.y);
    return {
      type: "circle",
      cx: center.px,
      cy: center.py,
      r: cc.r * cell
    };
  }
  const dx = b.x - a.x,
    dy = b.y - a.y;
  const t = Math.max(dim, dim) * 3;
  const norm = Math.hypot(dx, dy) || 1;
  const p1 = toPx(a.x - dx / norm * (t / cell), a.y - dy / norm * (t / cell));
  const p2 = toPx(a.x + dx / norm * (t / cell), a.y + dy / norm * (t / cell));
  return {
    type: "line",
    x1: p1.px,
    y1: p1.py,
    x2: p2.px,
    y2: p2.py
  };
}

// 危険度（その手で何通りの共円ができるか）を色に変換する
function dangerColor(count, max) {
  if (count <= 0) return "var(--safe)";
  const t = max <= 1 ? 1 : Math.min(1, count / max);
  // 黄 → 赤 のグラデーション
  const r = Math.round(232 + (232 - 232) * t);
  const g = Math.round(197 - 111 * t);
  const b = Math.round(90 - 28 * t);
  return `rgb(${r},${g},${b})`;
}
function Board({
  radius,
  stones,
  players,
